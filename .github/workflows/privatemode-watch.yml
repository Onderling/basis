# Weekly: does Privatemode's release notes page deprecate or remove a model the bot uses? Then an issue says so.
# (kimi-k2.6 was deprecated in v1.56.0 and removed in v1.58.0; we heard of it when the bot stopped answering.)
name: privatemode-watch
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Read the release notes
        id: watch
        run: |
          set +e
          node scripts/privatemode-release-watch.mjs > watch.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat watch.txt
      - name: Open an issue (once)
        if: steps.watch.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Privatemode: a model the bot uses is deprecated or removed"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number -q '.[].number')" ]; then
            gh issue create --title "$title" --body "$(printf 'The weekly watch of https://docs.privatemode.ai/release/ found:\n\n%s\n\nChange the model before it is removed: PRIVATEMODE_DEFAULT_MODEL (packages/llm-client/src/providers/privatemode.js) and assistant.fallbackModel (apps/basis/src/telegram/assistantLlm.js), or PRIVATEMODE_MODEL in the box'"'"'s .env.' "$(cat watch.txt)")"
          fi
