# =============================================================================
# onderling — CI
# -----------------------------------------------------------------------------
# WHAT CHANGED (2026-08-24) and why, because the previous version of this file
# gated nothing for two weeks while looking like it did:
#
#   * INSTALL. Six jobs each ran `npm ci --prefix <dir>`, which cannot resolve
#     pnpm's `workspace:` protocol (EUNSUPPORTEDPROTOCOL). This repo is ONE pnpm
#     workspace; it installs at the root, once, with the pinned pnpm.
#   * THE SECOND HALF OF INSTALLING. A clean `pnpm install` finishes with some
#     workspace symlinks missing (measured: `packages/core/node_modules/
#     @onderling/params` absent → the guards aggregate lands 17/18). Installing
#     this repo is TWO commands; `relink-workspace` is not a repair here, it is
#     step two. See docs/architecture.md § "How the monorepo resolves".
#   * COVERAGE. It ran six suites and never ran the guards aggregate, basis,
#     stoop or the journeys — so ~5k basis tests and every journey had never
#     been a gate at all.
#   * TRIGGER. It ran on push to master/track-H-folio only, so work on a feature
#     branch had no CI even when CI worked. Now: every branch, every PR.
#   * JOBS THAT CANNOT FAIL. `react-native` was continue-on-error for parser
#     failures that no longer exist (measured: 396 pass, 0 fail). A check that
#     cannot fail is not a check — it reports, and reporting is what produced
#     the false confidence above. It now gates like the rest.
#
# TIERING follows the property class (plans/design/6_architecture_enforcement.md):
# structural checks are cheap and deterministic, so they run first and fastest;
# convergence-under-concurrency (the journeys) is slower and runs in its own lane.
#
# ⚠ TWO GAPS, BOTH DELIBERATE AND BOTH LOUD RATHER THAN QUIET:
#
#   1. `apps/basis` — the LARGEST suite (~5,175 tests) — is NOT here. It cannot
#      be built from this repository alone: `apps/basis/package.json` declares
#      `"onderling-feedback": "link:../../../feedback"`, a SIBLING REPO outside
#      the checkout, and three source files import `onderling-feedback/public`.
#      Measured 2026-08-24 on a clean clone: install succeeds, then those files
#      fail to resolve. `apps/basis-mobile` carries the same link.
#      Fixing it is a decision, not a tweak — see the ledger. Landing CI without
#      it is deliberate: a job that always fails teaches people to ignore red,
#      which is the exact habit this rewrite exists to end.
#
#   2. ⚠ STILL A MANUAL STEP ON GITHUB: marking these jobs required in branch
#      protection. Until that is done this file reports and does not gate.
# =============================================================================

name: tests

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job installs the same way. Kept here so the recipe cannot drift
  # between jobs — the drift class this file is being rewritten to end.
  STORE_PATH: ~/.pnpm-store

jobs:
  # ── Rung 2: structural checks. Cheap, deterministic, first to fail. ─────────
  checks:
    name: guards + doc lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install (root workspace)
        run: pnpm install --frozen-lockfile
      - name: Relink workspace (the second half of installing — see header)
        run: node scripts/relink-workspace.mjs
      - name: Guards aggregate
        run: npm run guards
      - name: Doc organisation lint
        run: npm run lint:docs

  # ── The unit + integration suites, in parallel so a failure names itself. ───
  suites:
    name: ${{ matrix.suite.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          # `core` keeps vitest's --retry=2 for one known timing-flaky scenario
          # (mesh-scenario.test.js, WebRTC auto-upgrade phase 10b). Two retries
          # failing in a row is a real regression.
          - { label: core,              dir: packages/core,              args: '-- --retry=2' }
          - { label: stoop,             dir: apps/stoop,                 args: '' }
          - { label: tasks-v0,          dir: apps/tasks-v0,              args: '' }
          - { label: item-store,        dir: packages/item-store,        args: '' }
          - { label: circles,           dir: packages/circles,           args: '' }
          - { label: pod-client,        dir: packages/pod-client,        args: '' }
          - { label: relay,             dir: packages/relay,             args: '' }
          - { label: integration-tests, dir: packages/integration-tests, args: '' }
          # folio: --retry=2 for ONE load-sensitive test —
          #   SyncEngine > "caps total wait at maxStableWaitMs for an ever-changing file".
          # It writes every 10ms expecting to beat a 25ms stability window, which a contended
          # runner cannot guarantee; it passed run 1 and failed run 2 on identical code, and
          # passes 514/514 locally. Same rule as core: failing twice in a row is a real
          # regression, not a flake — investigate rather than raising the retry count.
          - { label: folio,             dir: apps/folio,                 args: '-- --retry=2' }
          # react-native was `continue-on-error` for "known parser failures in
          # BleTransport/MdnsTransport". Measured 2026-08-24: 396 pass, 1 skip,
          # zero failures — the exemption outlived its reason by some margin.
          - { label: react-native,      dir: packages/react-native,      args: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install (root workspace)
        run: pnpm install --frozen-lockfile
      - name: Relink workspace
        run: node scripts/relink-workspace.mjs
      - name: ${{ matrix.suite.label }}
        run: npm test --prefix ${{ matrix.suite.dir }} ${{ matrix.suite.args }}

  # ── Rung 5: convergence under concurrency. Its own lane because it is slow ──
  # and because it is the only gate that crosses a real relay between agents.
  journeys:
    name: e2e journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install (root workspace)
        run: pnpm install --frozen-lockfile
      - name: Relink workspace
        run: node scripts/relink-workspace.mjs
      - name: Journeys (starts its own local relay)
        run: node apps/e2e-journeys/run.mjs
