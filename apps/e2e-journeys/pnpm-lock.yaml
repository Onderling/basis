lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

overrides:
  '@noble/hashes': ^2.2.0
  '@scure/bip39': ^2.0.1
  ws: ^8.21.0
  '@react-native-async-storage/async-storage': ^1.24.0
  bunyan: 2.0.5
  axios: ^1.20.0
  follow-redirects: ^1.16.1
  fast-uri: ^3.1.7
  ip-address: ^10.3.1

importers:

  .:
    dependencies:
      '@onderling-app/companion-node':
        specifier: workspace:*
        version: link:../companion-node
      '@onderling-app/pinboard':
        specifier: workspace:*
        version: link:../pinboard
      '@onderling/app-manifest':
        specifier: workspace:*
        version: link:../../packages/app-manifest
      '@onderling/blob-gateway':
        specifier: workspace:*
        version: link:../../packages/blob-gateway
      '@onderling/circles':
        specifier: workspace:*
        version: link:../../packages/circles
      '@onderling/core':
        specifier: workspace:*
        version: link:../../packages/core
      '@onderling/identity-resolver':
        specifier: workspace:*
        version: link:../../packages/identity-resolver
      '@onderling/kring-host':
        specifier: workspace:*
        version: link:../../packages/kring-host
      '@onderling/pod-client':
        specifier: workspace:*
        version: link:../../packages/pod-client
      '@onderling/pseudo-pod':
        specifier: workspace:*
        version: link:../../packages/pseudo-pod
      '@onderling/relay':
        specifier: workspace:*
        version: link:../../packages/relay
      '@onderling/secure-agent':
        specifier: workspace:*
        version: link:../../packages/secure-agent
      '@onderling/transports':
        specifier: workspace:*
        version: link:../../packages/transports
      '@onderling/vault':
        specifier: workspace:*
        version: link:../../packages/vault
