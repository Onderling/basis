lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

overrides:
  '@noble/hashes': ^2.2.0
  '@scure/bip39': ^2.0.1
  ws: ^8.20.0
  '@react-native-async-storage/async-storage': ^1.24.0
  bunyan: 2.0.5

importers:

  .:
    dependencies:
      '@onderling-app/companion-node':
        specifier: workspace:*
        version: link:../companion-node
      '@onderling-app/stoop':
        specifier: workspace:*
        version: link:../stoop
      '@onderling/blob-gateway':
        specifier: workspace:*
        version: link:../../packages/blob-gateway
      '@onderling/core':
        specifier: workspace:*
        version: link:../../packages/core
      '@onderling/identity-resolver':
        specifier: workspace:*
        version: link:../../packages/identity-resolver
      '@onderling/pod-client':
        specifier: workspace:*
        version: link:../../packages/pod-client
      '@onderling/relay':
        specifier: workspace:*
        version: link:../../packages/relay
      '@onderling/secure-agent':
        specifier: workspace:*
        version: link:../../packages/secure-agent
      '@onderling/transports':
        specifier: workspace:*
        version: link:../../packages/transports
      '@onderling/vault':
        specifier: workspace:*
        version: link:../../packages/vault
