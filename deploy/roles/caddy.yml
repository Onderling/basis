# deploy/roles/caddy.yml — TLS front for every role with a hostname. The Caddyfile is GENERATED by the
# box from the enabled roles' .caddy snippets (deploy/box/lib.sh render_caddyfile) into
# ${BOX_DIR}/data/caddy/Caddyfile; certificates come from Let's Encrypt (ports 80 + 443 open, DNS set).
services:
  caddy:
    image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d   # pinned by digest — re-vet + re-pin to update
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${BOX_DIR}/data/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${BOX_DIR}/data/www:/srv/box:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  caddy-data:
  caddy-config:
