# deploy/roles/companion.yml — the companion node as a box ROLE (hosts the relocatable agent over the
# mesh; a sealed inbox for its owner). Connects OUT to the relay on the compose network. Its owner
# CLAIMS it with the code it prints in its log (`logs companion | grep 'Claim:' | tail -1`), from their
# app; relay.caddy routes /manage* to it.
services:
  companion:
    build:
      context: ../..
      dockerfile: deploy/companion-node/Dockerfile
    restart: unless-stopped
    environment:
      # the box's own relay by default; a personal box dials the SHARED public relay (COMPANION_RELAY_URL in .env)
      COMPANION_RELAY_URL: "${COMPANION_RELAY_URL:-ws://relay:8787}"
      COMPANION_NODE_CONFIG_DIR: "/data/companion"
      COMPANION_MANAGE_HTTP_PORT: "8790"
      COMPANION_MANAGE_HTTP_HOST: "0.0.0.0"
      # on → the owner (a household bot) may put people's sealed agenda files, served at /feed/ (relay.caddy)
      COMPANION_FEEDS: "${COMPANION_FEEDS:-}"
    volumes:
      - companion-data:/data/companion
volumes:
  companion-data:
