# deploy/roles/relay.yml — the relay as a box ROLE (deploy/box). Same image as deploy/relay; plain
# HTTP inside the compose network, Caddy (roles/caddy.yml) terminates TLS → wss://${RELAY_DOMAIN}.
# Build context is the repo root (the pnpm workspace), relative to this file.
# The health check runs the wire-protocol smoke from inside the image, so that file belongs to this
# role's build inputs even though it is not part of the relay's dependency closure:
# box-paths: deploy/smoke/
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_REGION: "${R2_REGION:-auto}"
      BLOB_GATE_UPLOADERS: "${BLOB_GATE_UPLOADERS:-}"
      PUSH_PROVIDER: "${PUSH_PROVIDER:-}"
      EXPO_ACCESS_TOKEN: "${EXPO_ACCESS_TOKEN:-}"
      PUSH_TOKENS_DB: "/data/push-tokens.sqlite"
    volumes:
      - relay-data:/data
volumes:
  relay-data:
